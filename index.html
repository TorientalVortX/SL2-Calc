    <title>Aether Codex | SL2 Character Builder</title>
    <meta name="description" content="Sigrogana Legend 2 character builder: class, attribute, skill and trait planning with live derived stats.">
    <meta property="og:title" content="Aether Codex | SL2 Character Builder">
    <meta property="og:description" content="Plan SL2 characters with live derived stats, skills, traits and racials.">
    <meta property="og:type" content="website">

    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <!-- Sets the theme before first paint. External because the CSP (script-src 'self') blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <!-- Painted before any stylesheet loads. Without it the first frame of a
         cold load is white, which is a poor way to open a dark cinematic. -->
    <style>
      html, body { margin: 0; background: #04060a; }
      /* Kept in step with `--void` in each theme, by eye: this is only ever on
         screen for the moment before the real stylesheet arrives. */
      html[data-theme='light'], html[data-theme='light'] body { background: #dcd6c8; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/aether/main.tsx"></script>
</body>
